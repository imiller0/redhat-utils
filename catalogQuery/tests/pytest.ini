[pytest]
# Pytest configuration for query_operator_catalog

# Run from catalogQuery root directory
testpaths = tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --strict-markers
    --tb=short

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slow, requires catalog access)
    slow: Tests that take significant time to run

# Coverage options
[coverage:run]
source = query_operator_catalog
omit =
    test_*.py
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
